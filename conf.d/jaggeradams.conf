server {
    listen 80;
    server_name jaggeradams.com www.jaggeradams.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name jaggeradams.com www.jaggeradams.com;
    ssl_certificate     /etc/letsencrypt/live/jaggeradams.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jaggeradams.com/privkey.pem;

    location / {
        proxy_pass http://portfolio_frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
